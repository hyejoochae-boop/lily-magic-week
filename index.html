<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Joy and Lily's Wonderful Week</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Joy & Lily">
<meta name="theme-color" content="#9d6eff">

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Emilys+Candy&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4b2a68;
    --violet: #9d6eff;
    --pink: #ff7eb3;
    --gold: #ffd76a;
    --coral: #ff7a45;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; overscroll-behavior: none; -webkit-touch-callout: none; }
  body {
    font-family: 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: white;
    background-color: #b784e8;
    background-image: url('lily2_assets/skin_right3.png');
    background-repeat: repeat-y;
    background-position: left top;
    background-size: 100% auto;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }

  /* ── 배경 장식 ── */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star { position: absolute; color: white; opacity: 0; animation: twinkle 3.4s infinite; text-shadow: 0 0 12px rgba(255, 235, 165, 0.95); }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.35) rotate(0); } 50% { opacity: 1; transform: scale(1.25) rotate(12deg); } }

  /* ── 레이아웃 ── */
  .container {
    max-width: 900px; margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative; z-index: 2;
  }

  /* ── 헤더 ── */
  header { text-align: center; margin-bottom: 44px; }
  .title-main {
    font-family: 'Emilys Candy', 'Gowun Dodum', cursive;
    font-size: clamp(1.8rem, 5.5vw, 3.2rem);
    color: #fff7cf;
    text-shadow: 0 3px 0 #b858ba, 0 9px 26px rgba(63, 36, 120, 0.38), 0 0 28px rgba(255,255,255,0.75);
    line-height: 1.15;
    margin-bottom: 12px;
  }
  .title-ribbon {
    display: inline-block;
    margin: 0 auto 10px;
    padding: 6px 30px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.4);
    color: var(--ink);
    border: 2px solid rgba(255,255,255,.72);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 8px 24px rgba(83,48,130,.28);
    font-family: 'Emilys Candy', 'Gowun Dodum', sans-serif;
    font-size: clamp(.85rem, 2.4vw, 1.05rem);
    font-weight: 700;
  }
  .title-sub {
    font-family: 'Emilys Candy', 'Gowun Dodum', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: rgba(255,255,255,.88);
    text-shadow: 0 2px 8px rgba(66,35,100,.35);
    margin-top: 6px;
  }

  /* ── 캐릭터 버튼 ── */
  .char-buttons {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 52px;
  }

  .char-btn {
    width: min(340px, calc(50% - 12px));
    min-width: 240px;
    border-radius: 28px;
    padding: 30px 20px 26px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    border: 3px solid rgba(255,255,255,.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 22px 54px rgba(60,35,110,.3), inset 0 1px 0 rgba(255,255,255,.55);
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .char-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.22), transparent 70%);
    pointer-events: none;
  }
  .char-btn:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 32px 70px rgba(60,35,110,.38);
  }
  .char-btn:active { transform: translateY(-2px) scale(1.0); }

  .lily-btn {
    background: linear-gradient(160deg, rgba(157,110,255,.42), rgba(255,126,179,.32), rgba(100,80,200,.18));
    border-color: rgba(200,160,255,.7);
  }
  .joy-btn {
    background: linear-gradient(160deg, rgba(255,180,60,.42), rgba(255,120,100,.32), rgba(200,100,50,.18));
    border-color: rgba(255,200,120,.7);
  }

  .char-fairy { width: 150px; height: 150px; }
  .char-fairy svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 18px rgba(0,0,0,.22)); }

  .char-name {
    font-family: 'Emilys Candy', 'Gowun Dodum', cursive;
    font-size: 2.2rem;
    line-height: 1;
    text-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .lily-btn .char-name { color: #fff4f8; text-shadow: 0 3px 0 #b858ba; }
  .joy-btn  .char-name { color: #fff8e8; text-shadow: 0 3px 0 #c05010; }

  .char-tagline {
    font: 700 .95rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: rgba(255,255,255,.88);
    margin-top: -4px;
  }
  .char-enter {
    margin-top: 8px;
    background: rgba(255,255,255,.22);
    border: 2px solid rgba(255,255,255,.65);
    border-radius: 999px;
    padding: 8px 24px;
    font: 700 .92rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: white;
    transition: background .15s;
  }
  .char-btn:hover .char-enter { background: rgba(255,255,255,.35); }

  /* ── 공유 메모 보드 ── */
  .shared-board {
    border-radius: 28px;
    padding: 28px 24px 32px;
    border: 2px solid rgba(255,255,255,.55);
    background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(200,180,255,.12));
    box-shadow: 0 22px 52px rgba(58,34,102,.22), inset 0 1px 0 rgba(255,255,255,.42);
  }
  .board-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .board-header h2 {
    font-family: 'Emilys Candy', 'Gowun Dodum', sans-serif;
    font-weight: 900;
    font-size: clamp(1.4rem, 4vw, 1.85rem);
    color: #fff7cf;
    text-shadow: 0 2px 0 #b858ba, 0 6px 16px rgba(63,36,120,.3);
    margin-bottom: 6px;
  }
  .board-header p {
    font: 700 .88rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: rgba(255,255,255,.65);
  }

  /* 메시지 리스트 */
  .msg-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 22px;
    min-height: 90px;
    max-height: 480px;
    overflow-y: auto;
    padding: 2px 4px;
  }
  .msg-list::-webkit-scrollbar { width: 4px; }
  .msg-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 2px; }

  .msg-empty {
    text-align: center;
    padding: 28px;
    font: 700 1rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: rgba(255,255,255,.42);
  }
  .msg-empty .empty-icon { display: block; font-size: 2.4rem; margin-bottom: 8px; }

  .msg-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    word-break: break-word;
    animation: bubblePop .35s ease;
  }
  @keyframes bubblePop { 0%{transform:scale(.88);opacity:0} 100%{transform:scale(1);opacity:1} }

  .msg-bubble.from-lily {
    align-self: flex-start;
    background: rgba(255,255,255,.5);
    border: 1.5px solid rgba(180,140,255,.55);
    border-bottom-left-radius: 6px;
  }
  .msg-bubble.from-joy {
    align-self: flex-end;
    background: rgba(255,255,255,.5);
    border: 1.5px solid rgba(255,180,80,.55);
    border-bottom-right-radius: 6px;
  }
  .msg-sender {
    font: 700 .72rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    margin-bottom: 4px;
    opacity: .88;
  }
  .from-lily .msg-sender { color: #7c3fd8; }
  .from-joy  .msg-sender { color: #d9720a; }
  .msg-text {
    font: 500 .95rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: #000;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg-date {
    font: 500 .66rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: rgba(0,0,0,.42);
    margin-top: 5px;
    text-align: right;
  }
  .msg-del {
    float: right;
    background: none;
    border: none;
    color: rgba(255,255,255,.35);
    font-size: .8rem;
    cursor: pointer;
    margin-left: 8px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .msg-del:hover { color: rgba(255,150,150,.8); background: rgba(255,80,80,.18); }

  /* 쪽지 작성 */
  .compose-wrap {
    background: rgba(255,255,255,.1);
    border-radius: 18px;
    padding: 18px;
    border: 1.5px solid rgba(255,255,255,.22);
  }
  .compose-title {
    font: 700 .82rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: rgba(255,255,255,.65);
    margin-bottom: 10px;
    text-align: center;
  }
  .sender-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .sender-btn {
    flex: 1;
    padding: 9px 6px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.72);
    font: 700 .92rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    cursor: pointer;
    transition: all .18s;
  }
  .sender-btn:hover { background: rgba(255,255,255,.2); }
  .sender-btn.active-lily {
    background: rgba(157,110,255,.4);
    border-color: #c4a0ff;
    color: white;
    box-shadow: 0 4px 14px rgba(157,110,255,.3);
  }
  .sender-btn.active-joy {
    background: rgba(255,160,60,.4);
    border-color: #ffb060;
    color: white;
    box-shadow: 0 4px 14px rgba(255,140,50,.3);
  }
  .msg-textarea {
    width: 100%;
    background: rgba(255,255,255,.12);
    border: 1.5px solid rgba(255,255,255,.25);
    border-radius: 12px;
    color: white;
    font: 500 1rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    padding: 12px 14px;
    resize: none;
    box-sizing: border-box;
    outline: none;
    line-height: 1.5;
    transition: border-color .15s;
    touch-action: manipulation;
  }
  .msg-textarea:focus { border-color: rgba(255,255,255,.55); }
  .msg-textarea::placeholder { color: rgba(255,255,255,.32); }
  .msg-send-btn {
    margin-top: 12px;
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #9d6eff, #ff7eb3);
    color: white;
    font: 700 1rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(100,60,160,.25);
    transition: opacity .15s, transform .12s;
  }
  .msg-send-btn:hover { opacity: .9; transform: translateY(-1px); }
  .msg-send-btn:active { opacity: .85; transform: translateY(0); }

  /* 메시지 안 사진 */
  .msg-media {
    display: block;
    max-width: 100%;
    max-height: 320px;
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1.5px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.15);
  }
  .msg-media.is-image { cursor: zoom-in; object-fit: cover; }
  .msg-bubble:has(.msg-media) { max-width: 92%; }

  /* 첨부 버튼 & 미리보기 */
  .attach-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .attach-btn {
    flex: 1;
    padding: 11px 8px;
    border-radius: 12px;
    border: 1.5px dashed rgba(255,255,255,.4);
    background: rgba(255,255,255,.08);
    color: rgba(255,255,255,.8);
    font: 700 .92rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    cursor: pointer;
    transition: all .18s;
  }
  .attach-btn:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.6); }
  .attach-btn:active { transform: translateY(1px); }
  .attach-btn:disabled { opacity: .5; cursor: default; }

  .attach-preview {
    margin-top: 12px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.18);
  }
  .attach-preview img {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    background: rgba(0,0,0,.25);
  }
  .attach-remove {
    position: absolute;
    top: 8px; right: 8px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.85);
    background: rgba(30,10,50,.7);
    color: white;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
  }
  .attach-remove:hover { background: rgba(255,80,80,.85); }
  .attach-status {
    padding: 12px;
    text-align: center;
    font: 700 .88rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
    color: rgba(255,255,255,.8);
  }

  /* 사진 확대 라이트박스 */
  .lightbox {
    position: fixed; inset: 0;
    z-index: 300;
    background: rgba(20,8,40,.9);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }

  /* 토스트 */
  .toast {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    z-index: 210; opacity: 0;
    transition: all .45s cubic-bezier(.34,1.56,.64,1);
    max-width: 92vw; white-space: nowrap;
    padding: 12px 22px; border-radius: 999px;
    background: linear-gradient(135deg, #fff4a7, #ff9dca);
    color: var(--ink); border: 3px solid white;
    box-shadow: 0 12px 28px rgba(85,45,122,.28);
    font: 700 .95rem 'Emilys Candy', 'Gowun Dodum', sans-serif;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 아바타 애니메이션 ── */
  .floating { animation: fairyFloat 3.1s ease-in-out infinite; transform-origin: center; }
  @keyframes fairyFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .wings-anim { animation: wingFlap 1.45s ease-in-out infinite; transform-origin: 200px 220px; }
  @keyframes wingFlap { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.92); } }
  .new-item { animation: newItemGlow 1.15s ease-out; transform-origin: center; }
  @keyframes newItemGlow { 0%{opacity:0;transform:scale(0) rotate(-25deg);filter:drop-shadow(0 0 18px #fff4a7)} 55%{opacity:1;transform:scale(1.25)} 100%{opacity:1;transform:scale(1)} }
  .av-loading { font-size: 3.5rem; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; animation: fairyFloat 2s ease-in-out infinite; }

  /* 반응형 */
  @media (max-width: 580px) {
    .char-buttons { flex-direction: column; align-items: center; }
    .char-btn { width: min(340px, 100%); }
    .shared-board { padding: 20px 14px 24px; }
    .compose-wrap { padding: 14px; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="toast" id="toast"></div>

<div class="container">
  <header>
    <div class="title-main">Joy and Lily's</div>
    <div class="title-main" style="margin-top:-6px">Wonderful Week</div>
    <div class="title-ribbon">Weather Fairies</div>
    <div class="title-sub">날씨 요정들의 특별한 일주일로 들어오세요!</div>
  </header>

  <!-- ── 캐릭터 버튼 ── -->
  <div class="char-buttons">

    <!-- Joy 버튼 -->
    <a href="joy.html" class="char-btn joy-btn">
      <div class="char-fairy" id="avJoy"><div class="av-loading">🌟</div></div>
      <div class="char-name">Joy</div>
      <div class="char-tagline">🌈 Weather Fairy</div>
      <div class="char-enter">Joy's Room 입장 ✨</div>
    </a>

    <!-- Lily 버튼 -->
    <a href="lily.html" class="char-btn lily-btn">
      <div class="char-fairy" id="avLily"><div class="av-loading">🧚</div></div>
      <div class="char-name">Lily</div>
      <div class="char-tagline">🌙 Weather Fairy</div>
      <div class="char-enter">Lily's Room 입장 ✨</div>
    </a>

  </div>

  <!-- ── 공유 쪽지 보드 ── -->
  <section class="shared-board">
    <div class="board-header">
      <h2>💌 Joy & Lily's 쪽지 보드</h2>
      <p>서로에게 쪽지를 남겨보세요 ✨</p>
    </div>

    <div class="msg-list" id="msgList">
      <div class="msg-empty">
        <span class="empty-icon">💌</span>
        아직 쪽지가 없어요. 첫 번째 쪽지를 남겨보세요!
      </div>
    </div>

    <div class="compose-wrap">
      <div class="compose-title">쪽지 보내는 사람을 선택하세요</div>
      <div class="sender-row">
        <button type="button" class="sender-btn active-lily" id="btnLily" onclick="setSender('lily')">🧚 Lily</button>
        <button type="button" class="sender-btn" id="btnJoy"  onclick="setSender('joy')">🌟 Joy</button>
      </div>
      <textarea class="msg-textarea" id="msgInput" rows="3" placeholder="쪽지 내용을 입력하세요..."></textarea>

      <div class="attach-preview" id="attachPreview" style="display:none;"></div>

      <div class="attach-row">
        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFile(event)">
        <button type="button" class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()">📷 사진 첨부</button>
      </div>

      <button type="button" class="msg-send-btn" onclick="sendMsg()">보내기 💌</button>
    </div>
  </section>
</div>

<!-- 사진 확대 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" src="" alt=""></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ── 아바타 데이터 ──────────────────────────────
const LILY_WEEK_ITEMS = [
  ['🌸','Flower Crown','char'],['🌈','Magic Rainbow','bg'],['💫','Sparkle Wand','char'],
  ['🏰','Fairy Castle','bg'],['🦋','Butterfly Wings','char'],['⭐','Star Shower','bg'],['🌟','Full Magic','char']
];

const AV_ASSETS = 'lily2_assets/';
const AV_FIT = {
  av_hair_bow:    { img:'av_hair_bow.png',    scale:0.443, ox:24.80, oy:-31.30 },
  av_hair_pink:   { img:'av_hair_band.png',   scale:0.803, scaleX:1.185, ox:0.00, oy:-10.30 },
  av_hair_star:   { img:'av_hair_star.png',   scale:0.694, ox:22.70, oy:-33.20 },
  av_hair_flower: { img:'av_hair_flower.png', scale:0.735, ox:-0.20, oy:-13.59 },
  av_outfit_princess: { img:'av_outfit_princess.png', scale:0.953, ox:-0.20, oy:13.10 },
  av_outfit_rainbow:  { img:'av_outfit_rainbow.png',  scale:1.102, ox:0, oy:1.80 },
  av_outfit_galaxy:   { img:'av_outfit_galaxy.png',   scale:0.900, scaleX:1.300, ox:0.00, oy:-0.70 },
  av_outfit_angel:    { img:'av_outfit_angel.png',    scale:1.0485, ox:0, oy:1.22 },
  av_outfit_witch:    { img:'av_outfit_witch.png',    scale:0.900, scaleX:1.040, ox:0.60, oy:-0.70 },
  av_outfit_star:     { img:'av_outfit_star.png',     scale:0.900, ox:0, oy:13.10 },
  av_outfit_rose:      { img:'av_outfit_rose.png',    scale:0.900, scaleX:1.155, ox:0.00, oy:0.20 },
  av_outfit_ballet:    { img:'av_outfit_ballet.png',  scale:1.112, ox:-0.20, oy:1.20 },
  av_outfit_sporty:    { img:'av_outfit_sporty.png',  scale:1.137, ox:0.00, oy:2.20 },

function avLayer(id) {
  const f = AV_FIT[id];
  if (!f) return '';
  const sx = f.scaleX !== undefined ? f.scaleX : 1;
  return `<img src="${AV_ASSETS}${f.img}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;transform:translate(${f.ox}%, ${f.oy}%) scale(${f.scale*sx}, ${f.scale});">`;
}

function getUnlockedItems(history) {
  const count = Math.min((history || []).filter(w => w.success).length, LILY_WEEK_ITEMS.length);
  return LILY_WEEK_ITEMS.slice(0, count);
}

function getAvatarItems(roomPlaced) {
  return (roomPlaced || []).map(id => ({ id }));
}

function buildAvatarImage(who, unlockedItems, ownedAvatarItems) {
  ownedAvatarItems = ownedAvatarItems || [];
  const baseImg = who === 'joy' ? 'joy_final.png' : 'lily_final.png';
  const av = id => ownedAvatarItems.some(it => it.id === id);
  const hasId = ids => ownedAvatarItems.find(it => ids.includes(it.id) && AV_FIT[it.id]);

  const activeOutfit = ownedAvatarItems.find(it => it.id.startsWith('av_outfit_') && AV_FIT[it.id]);
  const activeShoes  = ownedAvatarItems.find(it => it.id.startsWith('av_shoes_') && AV_FIT[it.id]);
  const activeHair   = hasId(AV_HAIR_IDS);

  let html = `<div style="position:relative;width:100%;height:100%;">`;
  html += `<img src="${AV_ASSETS}${baseImg}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;">`;
  if (activeShoes)  html += avLayer(activeShoes.id);
  if (activeOutfit) html += avLayer(activeOutfit.id);
  if (activeHair)   html += avLayer(activeHair.id);
  ownedAvatarItems.forEach(it => { if (AV_ACC_IDS.includes(it.id) && AV_FIT[it.id]) html += avLayer(it.id); });

  html += `</div>`;
  return html;
}

// ── 첨부 파일 선택 ──
function handleFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';           // 같은 파일 다시 선택 가능하도록 초기화
  if (!file) return;

  const preview = document.getElementById('attachPreview');
  const isImage = file.type.startsWith('image/');
  if (!isImage) { showToast('사진만 첨부할 수 있어요.'); return; }

  preview.style.display = 'block';
  preview.innerHTML = `<div class="attach-status">⏳ 불러오는 중...</div>`;

  compressImage(file, 1280, 0.72)
    .then(dataURL => {
      pendingMedia = { type: 'image', data: dataURL };
      showPreview();
    })
    .catch(() => { clearAttach(); showToast('사진을 불러오지 못했어요.'); });
}

// ── 사진 압축 (캔버스로 리사이즈 후 JPEG 변환) ──
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ev => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── 첨부 미리보기 표시 ──
function showPreview() {
  const preview = document.getElementById('attachPreview');
  if (!pendingMedia) { clearAttach(); return; }
  const media = `<img src="${pendingMedia.data}" alt="첨부 사진">`;
  preview.innerHTML = media + `<button type="button" class="attach-remove" onclick="clearAttach()" title="첨부 취소">✕</button>`;
  preview.style.display = 'block';
}

// ── 첨부 취소 ──

}

// ── 메시지 전송 ──
function sendMsg() {
  const text = document.getElementById('msgInput').value.trim();
  if (!text && !pendingMedia) return;   // 글도 첨부도 없으면 무시
  const now = new Date();
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const msg = { from: currentSender, text, date: dateStr, ts: now.getTime() };
  if (pendingMedia) { msg.mediaType = pendingMedia.type; msg.mediaData = pendingMedia.data; }

  const sendBtn = document.querySelector('.msg-send-btn');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '보내는 중... ⏳'; }

  db.ref(HUB_REF).push(msg)
    .then(() => {
      document.getElementById('msgInput').value = '';
      clearAttach();
      showToast(currentSender === 'lily' ? '🧚 Lily의 쪽지가 전송됐어요!' : '🌟 Joy의 쪽지가 전송됐어요!');
    })
    .catch(() => showToast('전송 실패. 인터넷 연결이나 용량을 확인해주세요.'))
    .finally(() => {
      if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = '보내기 💌'; }
    });
}

// ── 메시지 삭제 ──
function deleteMsg(key) {
  if (!confirm('이 쪽지를 삭제할까요?')) return;
  db.ref(`${HUB_REF}/${key}`).remove();
}

// ── 메시지 렌더링 ──
function renderMsgs(msgs) {
  const list = document.getElementById('msgList');
  if (!msgs || msgs.length === 0) {
    list.innerHTML = `<div class="msg-empty"><span class="empty-icon">💌</span>아직 쪽지가 없어요. 첫 번째 쪽지를 남겨보세요!</div>`;
    return;
  }
  list.innerHTML = msgs.map(m => {
    const senderLabel = m.from === 'lily' ? '🧚 Lily' : '🌟 Joy';
    const text = m.text || '';
    const escaped = text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let mediaHtml = '';
    if (m.mediaType === 'image' && m.mediaData) {
      mediaHtml = `<img class="msg-media is-image" src="${m.mediaData}" alt="사진" onclick="openLightbox(this.src)">`;
    }
    const textHtml = text ? `<div class="msg-text">${escaped}</div>` : '';
    return `<div class="msg-bubble from-${m.from}">
      <button class="msg-del" onclick="deleteMsg('${m.key}')" title="삭제">✕</button>
      <div class="msg-sender">${senderLabel}</div>
      ${mediaHtml}
      ${textHtml}
      <div class="msg-date">${m.date}</div>
    </div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

// ── Firebase 실시간 리스너 (최근 70개만 표시) ──
db.ref(HUB_REF).limitToLast(70).on('value', snapshot => {
  const val = snapshot.val();
  const msgs = [];
  if (val) {
    Object.entries(val).forEach(([key, msg]) => msgs.push({ ...msg, key }));
    msgs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  }
  renderMsgs(msgs);
});

}

    star.style.animationDelay = Math.random() * 3.4 + 's';
    star.style.fontSize = (7 + Math.random() * 18) + 'px';
    container.appendChild(star);
  }
}
